# =============================================================
#  Logi-Track ZeroBaran - GitHub Actions Workflow
#  الفحص الدوري للشحنات كل ساعة
#  المؤلف: Baran Avisat
# =============================================================

name: Logi-Track ZeroBaran - Poll Shipments

on:
  schedule:
    # كل ساعة (UTC) - يُعدَّل حسب الحاجة
    - cron: '0 * * * *'
  workflow_dispatch: # تشغيل يدوي من واجهة GitHub

# لا نسمح بتشغيل أكثر من دورة في نفس الوقت
concurrency:
  group: poll-shipments
  cancel-in-progress: false

jobs:
  poll:
    name: فحص الشحنات وإرسال الإشعارات
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHON_VERSION: '3.11'
      TZ: Asia/Istanbul
      # تُمرَّر الأسرار عبر env لأن سياق secrets غير متاح داخل if
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      # =====================================================
      #  1. استرجاع الكود
      # =====================================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      #  2. إعداد Python
      # =====================================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # =====================================================
      #  3. تثبيت التبعيات
      # =====================================================
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ تم تثبيت كل التبعيات"

      # =====================================================
      #  4. التحقق من إعداد الأسرار
      #     غير قاتل: يُصدر ملخصاً واضحاً ويُخرج configured=false
      #     بدل فشل الدورة إن لم تُضبط الأسرار بعد.
      # =====================================================
      - name: 🔍 Verify Secrets
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          MISSING=""
          [ -z "$SUPABASE_URL" ] && MISSING="$MISSING SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_KEY" ] && MISSING="$MISSING SUPABASE_SERVICE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::warning::أسرار غير مُعرَّفة:$MISSING — تم تخطّي دورة الفحص (البناء يبقى سليماً)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ لم يُضبط الدورة بعد"
              echo ""
              echo "الأسرار الناقصة:$MISSING"
              echo ""
              echo "أضفها من: Settings → Secrets and variables → Actions"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ كل الأسرار الضرورية موجودة"
          fi

      # =====================================================
      #  5. تشغيل سكريبت الفحص (يُتخطّى إن لم تُضبط الأسرار)
      # =====================================================
      - name: 🔄 Run Polling Script
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          POLL_INTERVAL_HOURS: '1'
          TIMEZONE: Asia/Istanbul
          DEFAULT_LANGUAGE: 'ar'
        run: |
          echo "🚀 بدء دورة الفحص - $(date)"
          python scripts/poll_shipments.py
          echo "✅ انتهت دورة الفحص - $(date)"

      # =====================================================
      #  6. رفع السجلات (للتشخيص)
      # =====================================================
      - name: 📤 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logi-track-logs-${{ github.run_id }}
          path: |
            logs/
          retention-days: 7
          if-no-files-found: ignore

      # =====================================================
      #  7. إشعار على فشل الدورة
      #     يُشغَّل فقط عند فشل + توفر إعداد البريد كاملاً
      #     (secrets غير متاحة داخل if — لذا نمرّرها عبر env)
      # =====================================================
      - name: 🚨 Notify on Failure
        if: failure() && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != ''
        continue-on-error: true # فشل الإشعار لا يُفشل الدورة مرة أخرى
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "🚨 Logi-Track ZeroBaran - فشل في دورة الفحص"
          # احتياطي ثابت: إن لم يُضبط سر ALERT_EMAIL يبقى للإشعار وجهة
          to: ${{ env.ALERT_EMAIL || 'baranavisat@gmail.com' }}
          from: Logi-Track ZeroBaran
          body: |
            حدث خطأ في دورة الفحص الدورية.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            يرجى مراجعة السجلات وإصلاح المشكلة.

            ---
            Logi-Track ZeroBaran v1.0.0
            المؤلف: Baran Avisat
